# Publicação no Render, no plano gratuito. No painel: New > Blueprint > escolha este repositório.
# Passo a passo e limites do plano gratuito: seção "Publicação" do README.
#
# Os nomes dos serviços formam os endereços (https://<nome>.onrender.com). Quando um nome já é de outro serviço, o
# Render acrescenta um sufixo ao endereço, sem avisar com clareza. Foi o que aconteceu com a API: o endereço dela é
# https://sulwork-eventos-api-ap04.onrender.com, e não https://sulwork-eventos-api.onrender.com, que é de outro
# serviço. Por isso BACKEND_URL e BACKEND_HOST_HEADER usam o endereço com sufixo. Confira sempre o endereço no painel.
databases:
  - name: sulwork-eventos-db
    plan: free
    databaseName: sulwork
    user: sulwork

services:
  # A API. No plano gratuito, um serviço web não recebe tráfego pela rede privada, então a interface a chama pelo
  # endereço público.
  - type: web
    name: sulwork-eventos-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sulwork-eventos-db
          property: connectionString
      - key: APP_DEMO_DATA
        value: "true"
      # O CORS só libera a origem da interface publicada.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://sulwork-eventos.onrender.com
      # A instância gratuita tem pouca memória e pouca CPU.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -XX:TieredStopAtLevel=1

  # A interface: o nginx serve os arquivos e repassa /api, /swagger-ui e /v3/api-docs à API.
  - type: web
    name: sulwork-eventos
    runtime: docker
    plan: free
    rootDir: frontend
    envVars:
      - key: BACKEND_URL
        value: https://sulwork-eventos-api-ap04.onrender.com
      - key: BACKEND_HOST_HEADER
        value: sulwork-eventos-api-ap04.onrender.com
      - key: PORT
        value: "80"
