spring:
  application:
    name: events-api
  web:
    locale: pt-BR
    locale-resolver: fixed
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sulwork}
    username: ${DB_USERNAME:sulwork}
    password: ${DB_PASSWORD:sulwork}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  demo-data: ${APP_DEMO_DATA:true}
  default-time-zone: ${APP_TIMEZONE:America/Sao_Paulo}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
