server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # O navegador fala só com este endereço. A API e a documentação vão para o backend.
    # O Host segue com a porta ($http_host, e não $host): o backend compara com o cabeçalho Origin que o navegador
    # manda nas escritas, e sem a porta ele trata a própria interface como outra origem e responde 403.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Os nomes dos arquivos de /assets/ mudam a cada versão, então o navegador pode guardá-los por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Qualquer outro endereço abre o index.html, e a interface decide a tela.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
